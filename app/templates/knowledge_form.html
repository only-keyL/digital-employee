{% extends "layout.html" %}

{% block title %}{{ form_title }} - 企业微信数字员工助手{% endblock %}

{% block content %}
<div class="page-header mb-3">
    <h2 class="h4 mb-1">{{ form_title }}</h2>
    <p class="text-muted small mb-0">新建默认保存为草稿（draft），不会自动提交审核。</p>
</div>

{% if form_error %}
<div class="alert alert-danger">{{ form_error }}</div>
{% endif %}

<div class="card-table p-3">
    <form method="post" action="{{ form_action }}">
        <div class="row g-3">
            <div class="col-md-8">
                <label class="form-label">问题标题 <span class="text-danger">*</span></label>
                <input class="form-control" name="title" value="{{ card.title or '' }}" required maxlength="200">
            </div>
            <div class="col-md-4">
                <label class="form-label">标签（逗号分隔）</label>
                <input class="form-control" name="tags" value="{{ card.tags or '' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">所属系统</label>
                <input class="form-control" name="system_name" value="{{ card.system_name or '' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">所属模块</label>
                <input class="form-control" name="module_name" value="{{ card.module_name or '' }}">
            </div>
            <div class="col-12">
                <label class="form-label">标准问题 <span class="text-danger">*</span></label>
                <textarea class="form-control" name="question" rows="3" required>{{ card.question or '' }}</textarea>
            </div>
            <div class="col-12">
                <label class="form-label">标准答案 <span class="text-danger">*</span></label>
                <textarea class="form-control" name="answer" rows="4" required>{{ card.answer or '' }}</textarea>
            </div>
            <div class="col-12">
                <label class="form-label">适用场景</label>
                <input class="form-control" name="scene" value="{{ card.scene or '' }}">
            </div>
            <div class="col-12">
                <label class="form-label">原因分析</label>
                <textarea class="form-control" name="reason_analysis" rows="3">{{ card.reason_analysis or '' }}</textarea>
            </div>
            <div class="col-12">
                <label class="form-label">排查步骤</label>
                <textarea class="form-control" name="troubleshooting_steps" rows="4">{{ card.troubleshooting_steps or '' }}</textarea>
            </div>
            <div class="col-12">
                <label class="form-label">处理建议 / 解决方案</label>
                <textarea class="form-control" name="solution" rows="4">{{ card.solution or '' }}</textarea>
            </div>
            <div class="col-12">
                <label class="form-label">风险提醒</label>
                <textarea class="form-control" name="risk_notice" rows="3">{{ card.risk_notice or '' }}</textarea>
            </div>
            <div class="col-md-6">
                <label class="form-label">来源群</label>
                <input class="form-control" name="source_group" value="{{ card.source_group or '' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">来源人</label>
                <input class="form-control" name="source_user" value="{{ card.source_user or 'admin' }}">
            </div>
        </div>
        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">保存</button>
            <a class="btn btn-outline-secondary" href="/knowledge-cards">返回列表</a>
            {% if card.id %}
            <a class="btn btn-outline-primary" href="/knowledge-cards/{{ card.id }}">查看详情</a>
            {% endif %}
        </div>
    </form>
</div>
{% endblock %}
